<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 마켓</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="logo">🌴 제주<span>마켓</span></div>
      <div class="nav-btns">
        <div class="nav-btns" id="authArea"></div>
        <button class="ghost-btn" id="openOrders">📦 주문내역</button>
        <button class="cart-btn" id="openCart" aria-label="장바구니 열기">🛒 장바구니 <span class="badge" id="badge">0</span></button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>제주의 맛과 멋을<br>집으로 가져가세요</h1>
      <p>한라봉부터 돌하르방까지, 제주 대표 상품을 골라 장바구니에 담아보세요.</p>
      <div class="deco">🍊</div>
    </section>

    <div class="tools">
      <div class="chips" id="chips"></div>
      <div class="seg" id="searchMode" role="group" aria-label="검색 범위">
        <button type="button" data-m="name" class="on">상품명만</button>
        <button type="button" data-m="all">상품명+설명</button>
      </div>
      <input class="search" id="search" type="search" placeholder="상품명으로 검색">
    </div>

    <section class="grid" id="grid"></section>

    <section class="location" id="location" aria-label="마켓 위치">
      <h2>📍 마켓 위치</h2>
      <p class="loc-addr"><strong>제주대학교 인문대학 2호관</strong><br>제주특별자치도 제주시 제주대학로 102 (아라일동)</p>
      <div id="map" role="region" aria-label="제주시 지도"></div>
      <a class="loc-link" href="https://www.openstreetmap.org/?mlat=33.4566&mlon=126.5614#map=16/33.4566/126.5614" target="_blank" rel="noopener">OpenStreetMap에서 크게 보기 ↗</a>
    </section>
  </main>

  <footer>장바구니는 이 브라우저에 저장된 번호로 구분되며 Supabase에 보관됩니다.</footer>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="장바구니">
    <div class="d-head"><h2>🛒 내 장바구니</h2><button class="x" id="closeCart" aria-label="닫기">×</button></div>
    <div class="d-list" id="lines"></div>
    <div class="d-foot">
      <div class="sum small"><span>상품 수량</span><span id="cnt">0개</span></div>
      <div class="sum"><span>합계</span><span id="total">₩0</span></div>
      <button class="order" id="order" disabled>주문하기</button>
      <button class="clear" id="clear">장바구니 비우기</button>
    </div>
  </aside>
  <div class="modal" id="modal"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="map.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
